<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>语文书桌 · Chinese Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./theme.css?v=1" />
</head>
<body>
  <!-- HOME -->
  <div class="screen" id="screenHome">
    <div class="top">
      <div class="brand">语文书桌</div>
      <button type="button" class="icon-btn" id="btnSettings" aria-label="说明" title="说明">?</button>
    </div>
    <div class="home-main">
      <div class="hero-mark" aria-hidden="true">语</div>
      <p class="mascot-line">与教材同步 · 先默写过关，再练考点</p>
      <p class="streak" id="streakLine">连续 <strong>0</strong> 天</p>
      <div class="today-card">
        <p class="eyebrow" id="sessionEyebrow">第二单元</p>
        <h1 id="sessionTitle">第8课 · 蝴蝶的家</h1>
        <p class="meta" id="sessionMeta">今日练习</p>
        <div class="home-cta-row">
          <button type="button" class="btn-start" id="btnStartToday">开始今日练习</button>
          <button type="button" class="btn-secondary" id="btnPrintToday">下载本课A4（10分钟）</button>
        </div>
        <button type="button" class="btn-warm" id="btnPrintRecite" style="width:100%;margin-top:8px">下载背诵默写（另+10分钟）</button>
        <button type="button" class="btn-path" id="btnOpenPath">看学期路径</button>
      </div>
      <p class="unit-line" id="unitLine">第二单元</p>
      <p class="path-summary" id="pathSummary">路径进度</p>
    </div>
  </div>

  <!-- PATH -->
  <div class="screen hidden" id="screenPath">
    <div class="path-top">
      <span style="width:42px"></span>
      <h1>学期学习路径</h1>
      <span style="width:42px"></span>
    </div>
    <p class="path-meta" id="pathMeta">按单元 · 课文顺序</p>
    <div class="path-scroll" id="pathList"></div>
  </div>

  <div class="overlay is-center hidden" id="pathLessonOverlay" aria-hidden="true">
    <div class="sheet" role="dialog">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 id="pathLessonTitle">这一课</h2>
        <button type="button" class="icon-btn" id="pathLessonClose" aria-label="关闭">×</button>
      </div>
      <p class="meta" id="pathLessonMeta"></p>
      <div class="mod-grid" id="pathModGrid"></div>
    </div>
  </div>

  <!-- RECORDS -->
  <div class="screen hidden" id="screenRecords">
    <div class="path-top records-top">
      <span style="width:42px"></span>
      <h1>记录</h1>
      <span style="width:42px"></span>
    </div>
    <div class="records-score" id="recordsScore"></div>
    <p class="path-meta">单元冲刺 · 重难点</p>
    <div class="records-actions" id="recordsActions"></div>
    <p class="path-meta" id="recordsMeta">错题记录</p>
    <div class="path-scroll" id="recordsList"></div>
    <div class="path-footer" style="padding:12px 16px">
      <button type="button" class="btn-start" id="btnRecordsToPath">去学期路径</button>
    </div>
  </div>

  <!-- LESSON -->
  <div class="screen hidden" id="screenLesson">
    <div class="lesson-top">
      <button type="button" class="icon-btn" id="btnCloseLesson" aria-label="回主页">←</button>
      <div class="progress" aria-hidden="true"><i id="progressFill"></i></div>
      <span style="width:42px"></span>
    </div>
    <div class="lesson-body">
      <p class="card-type" id="cardType">练习</p>
      <p class="lesson-unit" id="lessonUnitTitle" style="margin:0;color:var(--muted);font-size:.85rem"></p>
      <p class="lesson-name" id="lessonNameTitle" style="margin:4px 0 12px;font-weight:800"></p>
      <p class="card-prompt" id="cardPrompt">—</p>
      <p class="card-sub" id="cardSub"></p>
      <div id="cardExtra"></div>
      <div class="feedback hidden" id="cardFeedback"></div>
      <div class="lesson-actions" id="cardActions"></div>
    </div>
  </div>

  <nav class="app-nav" id="appNav" aria-label="主导航">
    <button type="button" class="nav-item is-on" data-nav="home" id="navHome">
      <span class="nav-emoji" aria-hidden="true">⌂</span>
      <span>主页</span>
    </button>
    <button type="button" class="nav-item" data-nav="path" id="navPath">
      <span class="nav-emoji" aria-hidden="true">◎</span>
      <span>路径</span>
    </button>
    <button type="button" class="nav-item" data-nav="records" id="navRecords">
      <span class="nav-emoji" aria-hidden="true">≡</span>
      <span>记录</span>
    </button>
  </nav>

  <div class="overlay is-center hidden" id="helpOverlay">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>怎么用</h2>
        <button type="button" class="icon-btn" id="btnCloseHelp">×</button>
      </div>
      <p style="line-height:1.6;margin:0;color:var(--muted)">
        <b>主页</b>：当日课文练习（现为第8课）。<br/>
        <b>路径</b>：按单元→课文→语文园地；每课含字词默写、组词、多音、课文默写、大意等。<br/>
        <b>记录</b>：错题、单元冲刺卷、重难点练习。<br/>
        与统编四上教材同步。可打印纸见 printables/。
      </p>
    </div>
  </div>

  <script src="./data.js?v=2"></script>
  <script src="./progress.js?v=2"></script>
  <script src="./app.js?v=2"></script>
  <script>
    document.getElementById("btnSettings").onclick = function () {
      document.getElementById("helpOverlay").classList.remove("hidden");
    };
    document.getElementById("btnCloseHelp").onclick = function () {
      document.getElementById("helpOverlay").classList.add("hidden");
    };
  </script>
</body>
</html>
